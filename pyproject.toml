[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exe-discord-bot"
version = "0.1.0"
description = "A safe, Linux-inspired scripting language for Discord"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "psutil>=6.0,<8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
